<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#DC2626" opacity="0.1"/>

  <!-- Main circle with gradient -->
  <defs>
    <linearGradient id="ranchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="80" fill="url(#ranchGradient)"/>

  <!-- Stylized R with modern design -->
  <g transform="translate(100, 100)">
    <!-- R letter with modern style -->
    <path d="M -15 -35 L -15 35 M -15 -35 L 15 -35 Q 25 -35 25 -25 Q 25 -15 15 -15 L -15 -15 M 0 -15 L 25 35"
          stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Decorative element - fork and spoon style -->
    <circle cx="-25" cy="25" r="4" fill="white"/>
    <circle cx="25" cy="25" r="4" fill="white"/>
    <line x1="-20" y1="30" x2="20" y2="30" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Border circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>
